<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <!--
    启动图（Splash）页面：由 Electron 桌面壳在「生产启动阶段」以 loadFile 本地加载，
    全程不依赖 Java 后端 —— 后端 sidecar 就绪前即可秒显，消除启动空窗/连接失败白屏。

    交互：
      - 本页只做「正在启动」的不确定进度动画；后端就绪、主窗口 ready-to-show 后由主进程
        直接关闭本窗并切到主窗口（见 dev-shell/main.js createSplashWindow / closeSplash），
        进度不伪造，也不承诺具体百分比。
      - 纯浏览器里打开本页同样展示动画，便于 UI 预览。

    资源：启动图为 ./splash-logo.png（复制自项目 bempdiff-logo.png，可替换）。
  -->
  <title>BempDiff — 启动中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      /* 干净明亮的渐变背景：柔和薄荷青 → 淡蓝，契合产品轻量科技感 */
      background: linear-gradient(150deg, #e8f7f3 0%, #eef4ff 55%, #f6f1fe 100%);
      color: #2b3a4a;
      overflow: hidden;
    }

    /* 居中容器：flex 纵向排布 logo → 文案 → 进度条 */
    .splash {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 32px;
    }

    /* 启动图：柔和阴影 + 轻微呼吸动画，增加品牌感又不刺眼 */
    .logo {
      width: 128px; height: 128px;
      object-fit: contain;
      border-radius: 24px;
      background: #ffffffcc;
      box-shadow: 0 12px 30px rgb(94 150 168 / 0.18);
      padding: 14px;
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    .brand { text-align: center; }
    .brand h1 {
      font-size: 22px; font-weight: 600;
      letter-spacing: .5px;
      color: #1f6f6a;
    }
    .brand p {
      margin-top: 6px;
      font-size: 13px; color: #7a8a99;
    }

    .stage {
      font-size: 13px; color: #5b6b7a;
      min-height: 18px;
      transition: opacity .2s ease;
    }

    /* 圆角细进度条：薄荷绿高亮，底部浅灰轨道 */
    .track {
      width: 260px; height: 8px;
      border-radius: 999px;
      background: #dfe7ef;
      overflow: hidden;
    }
    .bar {
      height: 100%; width: 8%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4fd1c5, #7aa7ff);
      transition: width .28s ease;
    }

    /* 不确定进度（常态动画：桌面壳关闭本窗前没有可订阅的进度源） */
    .bar.indeterminate {
      width: 35% !important;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <img class="logo" src="./splash-logo.png" alt="BempDiff" draggable="false" />
    <div class="brand">
      <h1>BempDiff</h1>
      <p>差异化对比工具 · 正在启动…</p>
    </div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="stage" id="stage">正在初始化…</div>
  </div>

  <script>
    (function () {
      // 桌面壳在后端就绪后直接关闭本窗并切主窗，期间没有可订阅的进度源，
      // 因此统一使用不确定进度动画——不伪造百分比。
      document.getElementById('bar').classList.add('indeterminate');
    })();
  </script>
</body>
</html>
